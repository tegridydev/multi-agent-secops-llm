name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Verify the one-command launcher
        run: |
          uv run masop.py check
          uv run masop.py demo
          uv run masop.py --home "$RUNNER_TEMP/masop" scan examples --rules-only --format json
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify installation outside the checkout
        run: |
          python -m pip install .
          cd "${RUNNER_TEMP}"
          secops-harness --version
          secops-harness demo --format json
          masop check
